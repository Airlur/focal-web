<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件选择弹窗诊断页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.8; }
    button { padding: 10px 20px; margin-right: 12px; font-size: 15px; cursor: pointer; }
    .log { background: #f5f5f5; border-radius: 8px; padding: 12px 16px; margin-top: 20px; font-size: 13px; white-space: pre-wrap; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>文件选择弹窗诊断页（无任何应用代码）</h2>
  <p>本页面不包含 React / Vite / Focal 的任何代码，只有两个裸的原生文件输入框。</p>
  <p>
    <button onclick="pick('f1', false)">选择文件（带类型过滤）</button>
    <input id="f1" type="file" accept="image/*,video/*" style="display:none">
    <button onclick="pick('f2', true)">选择文件夹</button>
    <input id="f2" type="file" webkitdirectory style="display:none">
  </p>
  <div class="log" id="log">点击上方按钮，这里会记录弹窗打开耗时。</div>
  <script>
    function pick(id, isFolder) {
      const input = document.getElementById(id);
      const log = document.getElementById('log');
      const t0 = performance.now();
      log.textContent += `\n[${new Date().toLocaleTimeString()}] 请求打开${isFolder ? '文件夹' : '文件'}选择器...`;
      input.onchange = () => {
        const ms = Math.round(performance.now() - t0);
        log.textContent += `\n  → 弹窗交互完成，从点击到选中耗时 ${ms}ms（选中 ${input.files.length} 项）`;
      };
      input.click();
    }
  </script>
</body>
</html>
